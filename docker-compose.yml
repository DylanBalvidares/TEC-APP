services:
  mysql-db:
    env_file:
      - ./backend-tecApp/db/.env
    image: mysql:8.0
    container_name: mysql-gestion
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=gestion_tecnica2
    ports:
      - "3306:3306"

    volumes:
    - ./backend-tecApp/db/gestion_tecnica2.sql:/docker-entrypoint-initdb.d/gestion_tecnica2.sql:ro
    - ./backend-tecApp/db/prueba.sql:/docker-entrypoint-initdb.d/prueba.sql:ro
    - db_data:/var/lib/mysql  

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    env_file:
    - ./backend-tecApp/db/.env
    build:
      context: ./backend-tecApp
      dockerfile: Dockerfile
    container_name: backend-tec-app
    restart: unless-stopped
    ports:
    - "9000:9000"
    
    networks:
    - app-network
    depends_on:
    - mysql-db
 
  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend-tecApp # <- Contexto en la carpeta del frontend
      dockerfile: Dockerfile     # <- Busca el Dockerfile ahí dentro
    container_name: frontend-tec-app
    restart: unless-stopped
    ports:
      - "5173:5173" # Reemplazar por "80:80" si en producción usás Nginx dentro de este Dockerfile
    volumes:
      # Monta el código fuente como bind mount para hot-reload sin rebuild
      - ./frontend-tecApp:/frontend
      # Anónimo: preserva node_modules del contenedor y evita que el mount lo sobrescriba
      - /frontend/node_modules
    networks:
      - app-network
    depends_on:
      - backend # Se asegura de levantar después de que el backend esté listo
  
  # --- PhpMyAdmin---
  phpmyadmin:
    depends_on:
    - mysql-db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8000:80"
    environment:
    -   PMA_ARBITRARY=1
    networks:
      - app-network
    
networks:
  app-network:
    driver: bridge

volumes:
  db_data:
