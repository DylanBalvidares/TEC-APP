services:
  mysql-db:
    env_file:
      - ./backend-tecApp/db/.env
    image: mysql:8.0
    container_name: mysql-gestion
    restart: unless-stopped
    environment:
      # Obligatorio: evita el clásico root/root_pass por defecto.
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en backend-tecApp/db/.env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-gestion_tecnica2}
    ports:
      # Sólo accesible desde la máquina anfitriona, no desde la red.
      - "127.0.0.1:3306:3306"

    volumes:
    - ./backend-tecApp/db/gestion_tecnica2.sql:/docker-entrypoint-initdb.d/gestion_tecnica2.sql:ro
    - ./backend-tecApp/db/prueba.sql:/docker-entrypoint-initdb.d/prueba.sql:ro
    - db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    env_file:
    - ./backend-tecApp/db/.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    build:
      context: .
      dockerfile: backend-tecApp/Dockerfile
    container_name: backend-tec-app
    restart: unless-stopped
    ports:
    - "9000:9000"

    volumes:
    # Persistencia de las imágenes de noticias (antes se perdían al recrear el contenedor).
    - uploads_data:/app/uploads

    networks:
    - app-network
    depends_on:
      mysql-db:
        condition: service_healthy

  # --- FRONTEND ---
  frontend:
    build:
      context: .
      dockerfile: frontend-tecApp/Dockerfile
    container_name: frontend-tec-app
    restart: unless-stopped
    ports:
      - "5173:5173" # Reemplazar por "80:80" si en producción usás Nginx dentro de este Dockerfile
    volumes:
      # Monta el código fuente como bind mount para hot-reload sin rebuild
      - ./frontend-tecApp:/frontend
      # Anónimo: preserva node_modules del contenedor y evita que el mount lo sobrescriba
      - /frontend/node_modules
    networks:
      - app-network
    depends_on:
      - backend # Se asegura de levantar después de que el backend esté listo

  # --- PhpMyAdmin ---
  # Herramienta de administración: accesible sólo desde la máquina anfitriona.
  phpmyadmin:
    depends_on:
    - mysql-db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8000:80"
    environment:
    -   PMA_ARBITRARY=1
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
