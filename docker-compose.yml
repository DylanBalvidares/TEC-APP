services:
  #contenedor de mysql(BD)
  mysql-db:
    env_file:
      #ruta de .env de BD
      - ./db/.env

    #docker descarga la version de mysql especificada
    image: mysql:8.0
    container_name: mysql-gestion

    #indica que si el pc se reinicia o el proceso mysql falla,docker lo levanta automaticamente
    restart: always

    #variables de entorno
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=gestion_tecnica2
    #mapea el puerto local(izq) al del contenedor(der)
    ports:
      - "3306:3306"

    #persistir datos(volumenes)
    volumes:
      - ./db/gestion_tecnica2.sql:/docker-entrypoint-initdb.d/init.sql
      #NUEVA LÍNEA: Guarda las bases de datos físicamente en tu PC
      - ./db/mysql_data:/var/lib/mysql
    networks:
      - app-network

  servicio-academico:
    #se busca un Dockerfile en la carpeta especificada y se "cocina" el codigo
    build:
      context: .
      dockerfile: ./servicio-academico/Dockerfile

    container_name: servicio-academico

    #mapea puerto local 3307 al mismo del contenedor
    ports:
      - "3307:3307"

    environment:
      # Usamos las credenciales definidas arriba

      DATABASE_URL: "mysql://root:root_pass@mysql-db:3306/gestion_tecnica2"

    #el servicio no arranca hasta que el servicio especificado(mysql) este prendido

    depends_on:
      - mysql-db
      - servicio-usuarios
    networks:
      - app-network
  servicio-auth:
    env_file:
      - ./servicio-auth/.env
    build:
      context: .
      dockerfile: ./servicio-auth/Dockerfile

    container_name: servicio-auth

    ports:
      - "3308:3308"

    environment:
      DATABASE_URL: "mysql://root:root_pass@mysql-db:3306/gestion_tecnica2"

    depends_on:
      - mysql-db

    networks:
      - app-network

  servicio-biblioteca:
    build:
      context: .
      dockerfile: ./servicio-biblioteca/Dockerfile

    container_name: servicio-biblioteca

    ports:
      - "3309:3309"

    environment:
      DATABASE_URL: "mysql://root:root_pass@mysql-db:3306/gestion_tecnica2"

    depends_on:
      - mysql-db

    networks:
      - app-network

  servicio-usuarios:
    env_file:
      - ./servicio-auth/.env

    build:
      context: .
      dockerfile: ./servicio-usuarios/Dockerfile

    container_name: servicio-usuarios

    ports:
      - "3310:3310"

    environment:
      DATABASE_URL: "mysql://root:root_pass@mysql-db:3306/gestion_tecnica2"

    depends_on:
      - mysql-db

    networks:
      - app-network

  servicio-comunidad:
    build:
      context: .
      dockerfile: ./servicio-comunidad/Dockerfile

    container_name: servicio-comunidad

    ports:
      - "3305:3305"

    volumes:
      # Mapea la carpeta de almacenamiento local al contenedor para persistir los archivos subidos
      - ./almacenamiento:/app/uploads
    environment:
      DATABASE_URL: "mysql://root:root_pass@mysql-db:3306/gestion_tecnica2"

    depends_on:
      - mysql-db

    networks:
      - app-network

  api-gateway:
    env_file:
      - ./servicio-auth/.env
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile

    container_name: api-gateway

    ports:
      - "9000:9000"

    environment:
      DATABASE_URL: "mysql://root:root_pass@mysql-db:3306/gestion_tecnica2"

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
